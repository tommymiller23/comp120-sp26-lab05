[mypy]
# --- Strictness Rules ---
# Forces all functions to have type annotations for parameters and return values
disallow_untyped_defs = True

# Errors if you manually write ': Any' in your code
disallow_any_explicit = True

# Forces containers like list, dict, and set to have subtypes (e.g., list[str])
disallow_any_generics = True

# --- Output Formatting ---
# Adds the 'note: In function "x":' context line to error messages
show_error_context = True

# Enables colorized output, code snippets, and error location carets (^)
pretty = True

# --- Recommended Extras (Implicitly helpful for your setup) ---
# Shows the specific error code (e.g., [no-untyped-def]) next to each error
show_error_codes = True

# Tells mypy to check the body of functions even if they aren't annotated
check_untyped_defs = True